<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="122" viewBox="0 1410 1200 122" preserveAspectRatio="none" role="img">
  <title>Thanks for stopping by.</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#111B26" />
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="1530" rx="14" fill="url(#background)" stroke="#30363D" stroke-width="2" />
  <g font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
    <text x="64" y="1448" font-size="20" xml:space="preserve"><tspan fill="#8B949E"># Thanks for stopping by. Stay curious and keep building.</tspan></text>
    <text x="64" y="1492" font-size="21" fill="#7EE787">$</text>
    <text x="90" y="1492" font-size="21" fill="#00C2FF">_<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="1s" repeatCount="indefinite" /></text>
  </g>
</svg>
